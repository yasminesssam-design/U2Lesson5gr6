<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحوسبة السحابية – منصة محترف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--n:#14337a;--b:#3b73c4;--g:#fbb94c;--ok:#2fb85f;--no:#e5484d}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;font-weight:600;font-size:24px;line-height:1.7;color:var(--n);background:#e8f2ff radial-gradient(#fff 2px,transparent 2px) 0 0/34px 34px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--n);color:#fff;padding:8px 14px;position:sticky;top:0;z-index:5}
.top img{height:54px;width:54px;border-radius:50%;background:#fff;object-fit:cover}
.bar{height:12px;background:#ffffff40;border-radius:9px;flex:1;min-width:70px}.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .4s}
main{max-width:860px;margin:auto;padding:14px;position:relative;z-index:1}
h1,h2,h3{font-weight:800;margin:.3em 0}h1{font-size:40px}h2{font-size:34px}h3{font-size:28px}
.btn{font:inherit;font-weight:800;font-size:26px;border:0;border-radius:22px;padding:12px 26px;background:var(--g);color:var(--n);box-shadow:0 6px 0 #c98a1e;cursor:pointer;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98a1e}.sm{font-size:20px;padding:6px 16px}
.card{background:#fff;border:4px solid var(--b);border-radius:26px;padding:14px 22px;margin:14px 0;box-shadow:0 6px 0 var(--b)}
.rc{cursor:pointer}.rc .x{display:none}.rc.on .x{display:block}.rc.on{background:#fff7e0;border-color:var(--g);box-shadow:0 6px 0 var(--g)}
.opt{display:block;width:100%;text-align:right;font:inherit;font-weight:800;font-size:26px;background:#fff;color:var(--n);border:4px solid var(--b);border-radius:20px;padding:10px 18px;margin:10px 0;box-shadow:0 5px 0 var(--b);cursor:pointer}
.opt.ok{background:#c9f5d7;border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}.opt.bad{background:#ffd5d7;border-color:var(--no);box-shadow:0 5px 0 var(--no)}
.c{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.gr{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:420px;margin:14px auto}
.gr b{aspect-ratio:1;display:grid;place-items:center;background:#fff;border:3px solid var(--b);border-radius:14px;font-size:30px;cursor:pointer;user-select:none}
.gr b.s{background:var(--g)}.gr b.f{background:#9fe3b5;border-color:var(--ok)}.gr b.k{background:#ffe08a;border-color:var(--g)}
.chip{display:inline-block;padding:2px 14px;margin:4px;border-radius:14px;background:#fff;border:3px solid var(--b)}.chip.f{background:#9fe3b5;border-color:var(--ok)}
.cf{position:fixed;top:-50px;font-size:34px;animation:fl 2.6s linear forwards;z-index:9;pointer-events:none}@keyframes fl{to{transform:translateY(115vh) rotate(360deg)}}
.cl{position:fixed;font-size:64px;opacity:.45;left:-100px;animation:dr 40s linear infinite;z-index:0}@keyframes dr{to{left:110%}}
.bob{display:inline-block;animation:bb 2s ease-in-out infinite}@keyframes bb{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:560px){body{font-size:21px}h1{font-size:32px}.opt,.btn{font-size:22px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
let S={n:'',b:0,best:{}},p=0,Q,ac;
const LOGO=document.querySelector('.top img').src;
function snd(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();[0,1].forEach(i=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=ok?'triangle':'sawtooth';o.frequency.value=ok?[660,880][i]:[220,180][i];o.connect(g);g.connect(ac.destination);g.gain.value=.15;o.start(t);o.stop(t+.12)})}catch(e){}}
function conf(){const E=['⭐','🎉','☁️','🌟'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%4];s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.7+'s';document.body.append(s);setTimeout(()=>s.remove(),3600)}}
const pts=()=>S.b+Object.values(S.best).reduce((a,x)=>a+x*10,0);
const lvl=()=>{const x=pts();return x>=400?'🏆 خبير السحابة':x>=200?'🥇 بطل':x>=60?'🥈 ذكي':'🥉 مبتدئ'};
function upd(pg){$('#nm').textContent='🌟 '+S.n;$('#pt').textContent='⭐ '+pts()+' | '+lvl();if(pg!=null)$('#pr').style.width=pg+'%'}
const rc=(i,t,x)=>`<div class="card rc" onclick="rv(this)"><h3>${i} ${t}</h3><div class="x">${x}</div></div>`;
function rv(e){if(!e.classList.contains('on')){e.classList.add('on');S.b+=5;snd(1);upd()}}
function home(){$('#tp').hidden=true;$('#app').innerHTML=`<div class="c"><img src="${LOGO}" width="200" style="border-radius:50%"><h1><span class="bob">☁️</span> مغامرة الحوسبة السحابية</h1><p>الصف السادس الابتدائي – تكنولوجيا المعلومات والاتصالات<br>الوحدة الثانية – الدرس الخامس</p><div class="card"><p>ما اسمك أيها البطل؟</p><input id="in" style="font:inherit;font-size:28px;padding:8px;border-radius:16px;border:4px solid var(--b);width:90%;text-align:center" placeholder="اكتب اسمك هنا"><br><button class="btn" onclick="go()">🚀 ابدأ اللعب</button></div></div>`}
function go(){const n=$('#in').value.trim();if(!n){$('#in').style.borderColor='red';return}S.n=n;$('#tp').hidden=false;p=0;lesson()}
const P=[
()=>`<h2>👋 أهلًا يا ${S.n}!</h2><div class="card"><h3>🎯 أهداف الدرس</h3>في نهاية هذا الدرس تكون قادرًا على أن:<br>⭐ تشرح مفهوم الحوسبة السحابية.<br>⭐ تحدّد إيجابيات استخدام الحوسبة السحابية وسلبياتها.<br>⭐ تناقش دور الحوسبة السحابية في تخزين الملفّات.</div><div class="card">🤖 <b>فكّر معي:</b> كيف تخزّن معلوماتك وملفاتك -كالصور مثلًا- رقميًا، وفي الحياة الواقعية في الوقت الحاضر؟</div>`,
()=>`<h2>☁️ ما الحوسبة السحابية؟</h2><p>اضغط على كل بطاقة لتفتحها وتجمع النجوم! 👆</p>${rc('🏠','غرفة تخزين ضخمة','تُعتبر مثل "غرفة تخزين" ضخمة جدًا على الإنترنت.')}${rc('🖥️','الخوادم','تتيح تخزين البيانات والبرامج والوصول إليها من خلال الخوادم عبر الإنترنت.')}${rc('🛡️','أفضل مكان لملفاتك','أفضل مكان لتخزين صورك وأعمالك وألعابك وملفاتك المهمة؛ لأنها تحميها من الضياع أو التلف.')}`,
()=>`<h2>🏢 أمثلة على مزودي الخدمة</h2>${rc('🔺','Google Drive','من أشهر مقدمي الخدمات. يُستخدم لتخزين الملفات والوصول إليها من أي مكان.')}${rc('☁️','OneDrive','خدمة تابعة لشركة مايكروسوفت من خلال Microsoft 365.')}${rc('📦','Dropbox','تطبيق تابع لشركة DropBox.')}`,
()=>`<h2>📸 مثال على الحوسبة السحابية</h2><div class="card">عندما تلتقط صورة بهاتفك، يمكنك حفظها تلقائيًا على "السحابة" مثل: OneDrive أو Google Drive ثم قم بفتح جهاز الكمبيوتر الخاص بك، وستجد الصورة موجودة هناك أيضًا.</div><div class="row" style="font-size:44px"><span>📱<br><small style="font-size:20px">تلتقط صورة</small></span>⬅<span class="bob">☁️<br><small style="font-size:20px">تُحفظ في السحابة</small></span>⬅<span>💻<br><small style="font-size:20px">تجدها في الكمبيوتر</small></span></div>`,
()=>`<h2>👍 الإيجابيات</h2><p>افتح البطاقات الخمس 👆</p>${rc('1️⃣','لا تفقد ملفات أبدًا','إذا تعطّل جهازك أو ضاع، تظل ملفاتك آمنة في "السحابة".')}${rc('2️⃣','شارك بسهولة','يمكنك مشاركة ملفاتك مع أصدقائك أو معلمك بسهولة، دون الحاجة إلى إرسالها بالبريد الإلكتروني.')}${rc('3️⃣','توفر مساحة','تساعدك على توفير مساحة كبيرة على جهازك.')}${rc('4️⃣','سهولة الوصول','يمكنك الوصول إلى ملفاتك من أجهزة متعددة بشرط الاتصال بالإنترنت.')}${rc('5️⃣','تشفير البيانات','توفر طبقة أمان إضافية للبيانات؛ حيث تمنع الأشخاص غير المصرح لهم من الوصول إلى البيانات.')}`,
()=>`<h2>👎 السلبيات</h2><p>افتح البطاقات الثلاث 👆</p>${rc('1️⃣','تحتاج إلى إنترنت','لا يمكنك الوصول إلى ملفاتك إذا لم يكن لديك اتصال بالإنترنت.')}${rc('2️⃣','مخاطر الأمان','قد لا تكون ملفاتك آمنة تمامًا إذا لم تستخدم كلمة مرور قوية أو إذا تعرضت "السحابة" للاختراق.')}${rc('3️⃣','تكلفة إضافية','قد تضطر لدفع المال مقابل مساحة تخزين أكبر.')}`,
()=>`<h2>💻 تطبيق عملي</h2><div class="card">🛠️ قم باستخدام الهاتف أو الكمبيوتر لمعرفة أي خدمة سحابية تستخدمها.</div><div class="c"><h3>🎉 أحسنت يا ${S.n}! أنت جاهز للأسئلة</h3><button class="btn" onclick="menu()">📝 هيا إلى الأسئلة</button></div>`];
function lesson(){$('#app').innerHTML=P[p]()+`<div class="row"><button class="btn" onclick="p=Math.max(0,p-1);lesson()" ${p?'':'disabled'}>➡ السابق</button><button class="btn" onclick="p<P.length-1?(p++,lesson()):menu()">التالي ⬅</button></div>`;upd((p+1)/P.length*100);scrollTo(0,0)}
const FB=['Google Drive','إنترنت','غير آمنة','مشاركة','زيادة','مايكروسوفت','الملفات','السحابية'],TB=['الحوسبة السحابية','الخوادم','OneDrive','Google Drive','Dropbox'];

const T=x=>x.map(y=>tf(...y));
const SETS={
